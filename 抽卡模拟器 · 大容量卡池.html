<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>抽卡模拟器 · 大容量卡池</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    background:#f5f5f7;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
    color:#111;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
    display:flex;justify-content:center;align-items:center;
    overflow:hidden;
  }
  .app{
    position:relative;
    width:100%;max-width:430px;
    height:100vh;height:100dvh;
    background:#fff;
    display:flex;flex-direction:column;
    overflow:hidden;
    padding-top:env(safe-area-inset-top);
  }
  @media (min-width:520px){
    .app{ height:min(880px,94vh);border-radius:48px;box-shadow:0 30px 80px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.04); }
  }

  /* 顶栏 */
  .topbar{ display:flex;align-items:center;justify-content:space-between;padding:20px 18px 4px;flex:none;gap:6px; }
  .topbar h1{ font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;flex:none; }
  .top-right{ display:flex;align-items:center;gap:6px;min-width:0; }
  .badge{
    font-size:9.5px;font-weight:500;color:#9a9aa0;background:#f7f7f9;
    padding:6px 9px;border-radius:100px;letter-spacing:0;
    font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;
  }
  .badge b{color:#111;font-weight:600}
  .badge .ssrColor{color:#b39b5c}
  .badge .spColor{color:#111}
  .icon-btn{
    border:none;background:#f5f5f7;color:#111;font-family:inherit;font-size:11px;font-weight:600;
    padding:6px 10px;border-radius:100px;letter-spacing:.2px;cursor:pointer;white-space:nowrap;flex:none;
  }
  .icon-btn:active{ opacity:.65; }

  /* 概率区 */
  .stat{ flex:none;padding:12px 22px 0;text-align:center; }
  .stat .label{ font-size:13px;color:#b0b0b6;letter-spacing:.6px;font-weight:500; }
  .stat .value{ font-size:58px;font-weight:700;line-height:1.04;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;margin:2px 0 4px; }
  .stat .value .unit{ font-size:22px;font-weight:600;letter-spacing:0;margin-left:3px;color:#c0c0c6; }
  .stat .sub{ font-size:12px;color:#a8a8ae;letter-spacing:.2px; }
  .stat .sub b{ color:#111;font-weight:600;font-variant-numeric:tabular-nums; }
  .stat .sub .spColor{ color:#111; }
  .bar{ height:6px;border-radius:100px;background:#f2f2f5;overflow:hidden;margin:16px 0 10px; }
  .bar-fill{ height:100%;width:2%;border-radius:100px;background:linear-gradient(90deg,#2b2b2b,#111);transition:width .4s cubic-bezier(.4,0,.2,1); }
  .hint{ font-size:11px;color:#c2c2c8;letter-spacing:.2px;font-variant-numeric:tabular-nums; }

  /* 舞台 */
  .stage{ flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 20px;overflow:hidden; }
  .placeholder{ font-size:13px;color:#d2d2d8;letter-spacing:.4px;animation:fadeIn .8s ease both; }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .grid{display:none;width:100%;gap:7px}
  .stage.show .grid{display:grid}
  .stage.show .placeholder{display:none}
  .grid.g10{grid-template-columns:repeat(5,1fr)}
  .grid.g1{grid-template-columns:1fr;max-width:150px;margin:0 auto}

  /* 卡片 */
  .card{
    position:relative;aspect-ratio:3/4;border-radius:14px;background:#fff;border:1px solid #eeeef1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;
    overflow:hidden;animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both;
    cursor:pointer;
  }
  @keyframes pop{from{opacity:0;transform:scale(.65) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .card .rarity{position:relative;z-index:2;font-size:10px;font-weight:800;letter-spacing:.8px;color:#c9c9cf}
  .card .cname{
    position:relative;z-index:2;font-size:9px;line-height:1.2;color:#aeaeB4;
    text-align:center;padding:0 2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card .idx{position:absolute;right:5px;bottom:3px;z-index:3;font-size:8px;color:#dcdce1;font-variant-numeric:tabular-nums}
  .card.n{border-color:#eeeef1;background:#fcfcfd}
  .card.n .rarity{color:#c0c0c6}.card.n .cname{color:#b0b0b6}
  .card.r{border-color:#cfe0ff;background:linear-gradient(160deg,#f7fbff,#eef5ff)}
  .card.r .rarity{color:#5b8def}.card.r .cname{color:#6a8fc7}
  .card.sr{border-color:#e0cfff;background:linear-gradient(160deg,#fbf7ff,#f3eaff);box-shadow:0 4px 16px -8px rgba(140,80,220,.3)}
  .card.sr .rarity{color:#9b5de5}.card.sr .cname{color:#8a5bc7}
  .card.ssr{border-color:#f1e1b3;background:linear-gradient(160deg,#fffefa 0%,#fdf5e2 100%);box-shadow:0 8px 26px -8px rgba(198,150,32,.45),inset 0 1px 0 #fff}
  .card.ssr:not(.has-img)::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(255,208,90,.5),transparent 62%);pointer-events:none}
  .card.ssr .rarity{color:#b39b5c}.card.ssr .cname{color:#9c8548}.card.ssr .idx{color:#e2cd96}
  .card.sp{border-color:#111;box-shadow:0 0 0 1.5px #111,0 8px 28px -8px rgba(0,0,0,.5)}
  .card.sp:not(.has-img){background:linear-gradient(135deg,#fffaf0 0%,#ffe9c8 35%,#f5f5f5 70%,#e8e8e8 100%)}
  .card.sp:not(.has-img)::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,rgba(0,0,0,.18),transparent 62%);pointer-events:none}
  .card.sp::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:6;
    box-shadow:inset 0 0 0 1.5px #111,inset 0 0 18px rgba(0,0,0,.35);
    animation:spPulse 2.4s ease-in-out infinite;
  }
  @keyframes spPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .card.sp .rarity{color:#111;font-weight:900}.card.sp .cname{color:#111;font-weight:600}

  /* 有图 */
  .card .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .card.has-img .rarity{
    position:absolute;top:4px;left:4px;z-index:3;background:rgba(255,255,255,.88);
    padding:1px 5px;border-radius:5px;font-size:8px;letter-spacing:.4px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .card.has-img .cname{
    position:absolute;left:0;right:0;bottom:0;z-index:3;padding:14px 3px 3px;
    background:linear-gradient(to top,rgba(0,0,0,.68),rgba(0,0,0,0));
    color:#fff !important;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card.has-img .idx{color:rgba(255,255,255,.85);text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:4}
  .card.gif-flag .cname::after{ content:' GIF';font-size:7px;opacity:.85; }

  /* 单抽放大 */
  .grid.g1 .card{border-radius:20px;gap:6px}
  .grid.g1 .rarity{font-size:15px;letter-spacing:1.2px}
  .grid.g1 .cname{font-size:12px}
  .grid.g1 .idx{font-size:9px;right:9px;bottom:7px}
  .grid.g1 .card.has-img .rarity{font-size:11px;padding:2px 8px;top:8px;left:8px;border-radius:8px}
  .grid.g1 .card.has-img .cname{font-size:11px;padding:18px 6px 5px}

  /* 按钮 */
  .actions{flex:none;display:flex;gap:12px;padding:8px 20px calc(16px + env(safe-area-inset-bottom))}
  .btn{
    flex:1;height:54px;border-radius:16px;border:none;font-family:inherit;font-size:16px;font-weight:600;
    letter-spacing:.5px;cursor:pointer;transition:transform .14s ease,opacity .14s ease;
  }
  .btn:active{transform:scale(.965);opacity:.88}
  .btn:disabled{opacity:.45;pointer-events:none}
  .btn-ghost{background:#fff;color:#111;box-shadow:inset 0 0 0 1px #e8e8ec}
  .btn-primary{background:#111;color:#fff;box-shadow:0 6px 18px -6px rgba(0,0,0,.45)}

  /* 编辑器 */
  .editor{
    position:absolute;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);
    will-change:transform;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  .editor.open{transform:translateY(0)}
  .ed-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;gap:10px}
  .ed-title{font-size:16px;font-weight:600;letter-spacing:-.2px}
  .ed-btn{
    border:none;background:#f5f5f7;color:#111;font-family:inherit;font-size:12px;font-weight:600;
    padding:8px 14px;border-radius:100px;letter-spacing:.3px;cursor:pointer;white-space:nowrap;
  }
  .ed-btn:active{opacity:.65}
  .ed-btn.accent{background:#111;color:#fff}
  .ed-tabs{flex:none;display:flex;gap:6px;padding:0 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .ed-tabs::-webkit-scrollbar{display:none}
  .ed-tab{
    flex:1;min-width:52px;border:none;background:#f5f5f7;border-radius:13px;padding:9px 2px;
    font-family:inherit;cursor:pointer;transition:background .15s ease;
  }
  .ed-tab .tab-r{display:block;font-size:12px;font-weight:700;color:#9a9aa0;letter-spacing:.4px}
  .ed-tab .tab-n{display:block;font-size:10px;color:#c2c2c8;margin-top:1px;font-variant-numeric:tabular-nums}
  .ed-tab.on{background:#111}
  .ed-tab.on .tab-r{color:#fff}
  .ed-tab.on .tab-n{color:rgba(255,255,255,.55)}
  .ed-note{
    flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:0 18px 8px;font-size:10px;color:#c0c0c6;letter-spacing:.1px;
  }
  .ed-note .ed-storage{font-variant-numeric:tabular-nums;color:#b0b0b6}
  .ed-reset{
    border:none;background:none;font-family:inherit;font-size:11px;color:#b0b0b6;
    text-decoration:underline;cursor:pointer;padding:2px;flex:none;
  }
  .ed-list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 24px}
  .ed-item{
    display:flex;align-items:center;gap:10px;padding:9px;margin-bottom:8px;
    background:#fbfbfd;border:1px solid #f0f0f3;border-radius:14px;
  }
  .ed-thumb{
    position:relative;flex:none;width:52px;height:70px;border-radius:10px;background:#f2f2f5;
    display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
    border:1px dashed #dcdce1;
  }
  .ed-thumb img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
  .ed-thumb .ph{font-size:10px;color:#b8b8be;letter-spacing:.5px}
  .ed-thumb .gif-tag{
    position:absolute;left:3px;bottom:3px;z-index:2;
    background:rgba(0,0,0,.55);color:#fff;font-size:8px;font-weight:700;
    padding:1px 4px;border-radius:4px;letter-spacing:.3px;
  }
  .ed-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
  .ed-name{
    width:100%;border:none;background:#fff;border-radius:9px;padding:8px 10px;
    font-family:inherit;font-size:16px;color:#111;box-shadow:inset 0 0 0 1px #ececf0;
    outline:none;-webkit-user-select:text;user-select:text;
  }
  .ed-name:focus{box-shadow:inset 0 0 0 1.5px #111}
  .ed-sub{font-size:10px;color:#b6b6bc;padding-left:2px;font-variant-numeric:tabular-nums}
  .ed-del{
    flex:none;width:28px;height:28px;border-radius:50%;border:none;background:#f5f5f7;color:#b0b0b6;
    font-size:13px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
  }
  .ed-del:active{background:#ffe8e8;color:#e05a5a}
  .ed-empty{text-align:center;padding:64px 20px;color:#c8c8ce;font-size:14px;line-height:1.9;letter-spacing:.3px}
  .ed-empty span{font-size:12px;color:#d8d8de}

  /* ============ 图鉴 ============ */
  .gallery{
    position:absolute;inset:0;z-index:55;background:#fff;
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .34s cubic-bezier(.4,0,.2,1);
    will-change:transform;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .gallery.open{transform:translateX(0)}
  .gl-head{
    flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px 12px;gap:10px;
  }
  .gl-progress{
    font-size:12px;font-weight:600;color:#b0b0b6;
    font-variant-numeric:tabular-nums;
    background:#f5f5f7;padding:6px 12px;border-radius:100px;
    letter-spacing:.2px;
  }
  .gl-list{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 16px 32px;
  }
  .gl-section{margin-bottom:24px}
  .gl-sec-title{
    display:flex;align-items:center;gap:8px;
    margin-bottom:10px;padding-left:2px;
  }
  .gl-sec-r{font-size:13px;font-weight:800;letter-spacing:1.2px}
  .gl-sec-r.sp{color:#111}
  .gl-sec-r.ssr{color:#b39b5c}
  .gl-sec-r.sr{color:#9b5de5}
  .gl-sec-r.r{color:#5b8def}
  .gl-sec-r.n{color:#b8b8be}
  .gl-sec-n{font-size:11px;color:#c2c2c8;font-variant-numeric:tabular-nums}
  .gl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 9px}
  .gl-item{
    display:flex;flex-direction:column;gap:4px;cursor:pointer;
    animation:glIn .4s ease both;
  }
  @keyframes glIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .gl-item.locked{cursor:default}
  .gl-thumb{
    position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
    background:#f2f2f5;border:1px solid #f0f0f3;
    display:flex;align-items:center;justify-content:center;
  }
  .gl-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
  .gl-ph{
    font-size:10px;color:#c0c0c6;padding:8px;text-align:center;
    line-height:1.35;word-break:break-word;letter-spacing:.2px;
  }
  .gl-item.locked .gl-thumb{filter:grayscale(1);opacity:.4}
  .gl-item.locked .gl-ph{color:#b8b8be}
  .gl-count{
    position:absolute;top:5px;right:5px;z-index:2;
    background:rgba(17,17,17,.82);color:#fff;
    font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:100px;
    font-variant-numeric:tabular-nums;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .gl-name{
    font-size:10px;color:#8a8a90;text-align:center;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    padding:0 2px;letter-spacing:.1px;
  }
  .gl-item.locked .gl-name{color:#c8c8ce}
  .gl-empty{
    text-align:center;padding:80px 20px;color:#c8c8ce;
    font-size:14px;letter-spacing:.3px;
  }

  /* ============ 抽卡演出层 ============ */
  .showcase{
    position:absolute;inset:0;z-index:70;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 28%, #fffdf7 0%, #ffffff 45%, #f3f3f6 100%);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
    overflow:hidden;padding:24px;
  }
  .showcase.open{opacity:1;pointer-events:auto}

  .showcase-flash{
    position:absolute;left:50%;top:50%;
    width:62vmin;height:62vmin;margin:-31vmin 0 0 -31vmin;
    background:radial-gradient(circle,rgba(255,248,220,1) 0%,rgba(240,222,170,.5) 40%,transparent 68%);
    opacity:0;pointer-events:none;border-radius:50%;z-index:3;
  }
  .showcase-flash.burst{animation:flashBurst 1s ease-out forwards}
  @keyframes flashBurst{
    0%{opacity:0;transform:scale(.3)}
    25%{opacity:1}
    100%{opacity:0;transform:scale(1.9)}
  }

  .showcase-darkburst{
    position:absolute;left:50%;top:50%;
    width:70vmin;height:70vmin;margin:-35vmin 0 0 -35vmin;
    border-radius:50%;z-index:4;opacity:0;pointer-events:none;
    background:radial-gradient(circle,rgba(0,0,0,.94) 0%,rgba(15,15,15,.65) 30%,transparent 68%);
    transform:scale(.2);
  }
  .showcase-darkburst.burst{animation:darkBurst .95s cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes darkBurst{
    0%{opacity:0;transform:scale(.2)}
    28%{opacity:1;transform:scale(.95)}
    100%{opacity:0;transform:scale(2.15)}
  }

  .showcase-body{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:26px;
    transform:scale(.3);opacity:0;
  }
  .showcase.open .showcase-body{
    animation:cardIn .65s cubic-bezier(.2,.9,.3,1.15) forwards;
  }
  @keyframes cardIn{
    0%{transform:scale(.3) translateY(16px);opacity:0}
    60%{transform:scale(1.04) translateY(0);opacity:1}
    80%{transform:scale(.985)}
    100%{transform:scale(1);opacity:1}
  }

  .showcase-card-wrap{position:relative;display:flex}
  .showcase-glow{
    position:absolute;left:50%;top:50%;
    width:120%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(230,205,150,.55),transparent 65%);
    filter:blur(30px);
    animation:glowPulse 2.6s ease-in-out infinite;
    pointer-events:none;z-index:0;
    transition:background .5s ease;
  }
  @keyframes glowPulse{
    0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}
    50%{opacity:.95;transform:translate(-50%,-50%) scale(1.08)}
  }
  .showcase-card-wrap.sp .showcase-glow{
    background:radial-gradient(circle,rgba(0,0,0,.5),transparent 65%);
  }

  .showcase-frame{
    position:relative;z-index:1;
    width:min(250px,64vw);
    aspect-ratio:3/4;
    border-radius:28px;
    box-shadow:0 24px 60px -18px rgba(160,130,60,.45);
    transition:box-shadow .4s ease;
  }
  .showcase-frame.sp{
    box-shadow:0 24px 70px -18px rgba(0,0,0,.6);
  }

  .frame-ring-clip{
    position:absolute;inset:0;
    border-radius:28px;
    overflow:hidden;
    z-index:0;
  }
  .frame-ring{
    position:absolute;left:50%;top:50%;
    width:220%;aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:conic-gradient(from 0deg,
      #c9b98f 0deg, #fffdf4 45deg, #e3d6b3 95deg,
      #b8a478 155deg, #fbf6e8 225deg, #d5c49c 290deg, #f2ead6 360deg);
    animation:frameSpin 3.2s linear infinite;
  }
  @keyframes frameSpin{
    to{transform:translate(-50%,-50%) rotate(360deg)}
  }
  .showcase-frame.sp .frame-ring{
    background:conic-gradient(from 0deg,
      #050505 0deg, #3d3d3d 30deg, #000 75deg,
      #2b2b2b 135deg, #5a5a5a 185deg, #000 245deg, #1c1c1c 300deg, #050505 360deg);
    animation-duration:4.5s;
  }

  .showcase-inner{
    position:absolute;inset:4px;
    border-radius:24px;
    background:#fff;
    z-index:1;
    transition:inset .35s ease,border-radius .35s ease,box-shadow .35s ease;
  }
  .showcase-frame.sp .showcase-inner{
    inset:6px;
    border-radius:22px;
    box-shadow:inset 0 0 0 2px #000;
  }

  .showcase-card3d{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    -webkit-transform-style:preserve-3d;
    transform:rotateY(0deg);
    transition:transform .8s cubic-bezier(.45,.05,.25,1);
    will-change:transform;
  }
  .showcase-card3d.flipped{transform:rotateY(180deg)}

  .face{
    position:absolute;inset:0;
    border-radius:24px;
    overflow:hidden;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .showcase-frame.sp .face{border-radius:22px}

  /* 卡背：纯色 + 花体英文 */
  .face.back{
    background:#efe8d8;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .back-mark{
    font-family:'Snell Roundhand','Apple Chancery','Brush Script MT','Segoe Script','Lucida Handwriting','URW Chancery L',cursive;
    font-size:clamp(26px,8.5vw,34px);
    font-weight:400;
    color:#b6a069;
    letter-spacing:.5px;
    line-height:1;
    transform:rotate(-4deg);
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    -webkit-user-select:none;user-select:none;
    white-space:nowrap;
  }

  .face.front{
    transform:rotateY(180deg);
    background:#fff;
  }
  .showcase-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .showcase-ph{
    font-size:22px;font-weight:700;letter-spacing:1.5px;
    color:#c9b98f;text-align:center;padding:0 18px;line-height:1.45;
    word-break:break-word;
  }

  .showcase-info{
    position:relative;z-index:1;text-align:center;
    opacity:0;
  }
  .showcase.open .showcase-info{
    animation:fadeUp .55s .95s ease forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(12px)}
    to{opacity:1;transform:translateY(0)}
  }

  .showcase-rarity{
    height:20px;
    font-size:13px;font-weight:800;letter-spacing:4px;
    margin-bottom:7px;text-align:center;
    transition:color .4s ease,letter-spacing .4s ease;
  }
  .showcase-rarity.ssr{color:#b39b5c}
  .showcase-rarity.sp{color:#111;font-weight:900;letter-spacing:5px}

  .showcase-name{
    font-size:20px;font-weight:700;letter-spacing:.5px;color:#1a1a1a;
    max-width:280px;margin:0 auto;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .showcase-name.sp{color:#000;font-weight:900;letter-spacing:1px}

  .showcase-hint{
    position:absolute;
    bottom:calc(28px + env(safe-area-inset-bottom));
    left:0;right:0;text-align:center;
    font-size:12px;color:#b9b9c0;letter-spacing:1px;
    opacity:0;transition:opacity .3s ease;z-index:5;
  }
  .showcase.ready .showcase-hint{opacity:1}

  /* 大图查看 */
  .viewer{
    position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.86);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
  }
  .viewer.open{opacity:1;pointer-events:auto}
  .viewer img{max-width:88%;max-height:80%;border-radius:16px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .viewer .vclose{
    position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;
    width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(255,255,255,.16);color:#fff;font-size:20px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .viewer .vclose:active{background:rgba(255,255,255,.3)}

  /* Toast */
  .toast{
    position:absolute;left:50%;bottom:96px;z-index:99;transform:translateX(-50%) translateY(10px);
    background:rgba(17,17,17,.92);color:#fff;font-size:12px;letter-spacing:.2px;
    padding:9px 18px;border-radius:100px;opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;white-space:nowrap;max-width:88%;
    overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="topbar">
    <h1>抽卡模拟器</h1>
    <div class="top-right">
      <div class="badge">
        <b id="total">0</b>抽 ·
        <b class="ssrColor" id="ssr">0</b>SSR ·
        <b class="spColor" id="sp">0</b>SP
      </div>
      <button class="icon-btn" id="btnGallery">图鉴</button>
      <button class="icon-btn" id="btnEdit">编辑</button>
    </div>
  </div>

  <section class="stat">
    <div class="label">当前 SSR 概率</div>
    <div class="value"><span id="rate">2.00</span><span class="unit">%</span></div>
    <div class="sub">
      SP <b class="spColor" id="spRate">0.20</b>% ·
      已连续 <b id="pity">0</b> 抽未出 SSR
    </div>
    <div class="bar"><div class="bar-fill" id="bar"></div></div>
    <div class="hint" id="hint">前 50 抽概率恒定 · 还有 50 抽开始提升</div>
  </section>

  <section class="stage" id="stage">
    <div class="placeholder" id="placeholder">点击下方按钮开始抽取</div>
    <div class="grid" id="grid"></div>
  </section>

  <footer class="actions">
    <button class="btn btn-ghost" id="btn1">单 抽</button>
    <button class="btn btn-primary" id="btn10">十 连</button>
  </footer>

  <!-- ============ 图鉴 ============ -->
  <div class="gallery" id="gallery">
    <div class="gl-head">
      <button class="ed-btn" id="glClose">返回</button>
      <div class="ed-title">图鉴</div>
      <div class="gl-progress" id="glProgress">0 / 0</div>
    </div>
    <div class="gl-list" id="glList"></div>
  </div>

  <!-- ============ 抽卡演出层 ============ -->
  <div class="showcase" id="showcase">
    <div class="showcase-flash" id="showcaseFlash"></div>
    <div class="showcase-darkburst" id="showcaseDarkburst"></div>

    <div class="showcase-body">
      <div class="showcase-card-wrap" id="showcaseCardWrap">
        <div class="showcase-glow"></div>
        <div class="showcase-frame" id="showcaseFrame">
          <div class="frame-ring-clip">
            <div class="frame-ring"></div>
          </div>
          <div class="showcase-inner">
            <div class="showcase-card3d" id="showcaseCard3d">
              <div class="face back">
                <span class="back-mark">Fortune</span>
              </div>
              <div class="face front">
                <img class="showcase-img" id="showcaseImg" alt="">
                <div class="showcase-ph" id="showcasePh"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="showcase-info">
        <div class="showcase-rarity ssr" id="showcaseRarity">SSR</div>
        <div class="showcase-name" id="showcaseName"></div>
      </div>
    </div>

    <div class="showcase-hint" id="showcaseHint">点击任意处继续</div>
  </div>

  <!-- 编辑器 -->
  <div class="editor" id="editor">
    <div class="ed-head">
      <button class="ed-btn" id="edClose">完成</button>
      <div class="ed-title">卡池编辑</div>
      <button class="ed-btn accent" id="edAdd">+ 添加</button>
    </div>
    <div class="ed-tabs" id="edTabs"></div>
    <div class="ed-note">
      <span>同稀有度内等概率 · GIF≤3MB</span>
      <span class="ed-storage" id="edStorage"></span>
    </div>
    <button class="ed-reset" id="edReset" style="align-self:flex-end;margin:0 18px 8px;font-size:11px">恢复默认卡池</button>
    <div class="ed-list" id="edList"></div>
  </div>

  <!-- 大图查看器 -->
  <div class="viewer" id="viewer">
    <button class="vclose" id="viewerClose">✕</button>
    <img id="viewerImg" alt="">
  </div>

</div>

<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  const RARITIES = ['SP', 'SSR', 'SR', 'R', 'N'];
  const DB_NAME = 'gacha_db_v3';
  const DB_VER  = 1;
  const META_KEY = 'cards';
  const OLD_KEY  = 'gacha_cards_v2';
  const STATS_KEY = 'gacha_stats_v1';

  /* 画质参数：高清主图 + 缩略图 */
  const MAX_EDGE_FULL  = 1440;
  const JPEG_Q_FULL    = 0.93;
  const MAX_EDGE_THUMB = 480;
  const JPEG_Q_THUMB   = 0.82;
  const MAX_GIF  = 3 * 1024 * 1024;

  const DEFAULT_CARDS = {
    SP:  ['炽天圣裁', '混沌源神', '万象归终', '星海造物', '永劫真理'],
    SSR: ['星辰之刃', '虚空龙皇', '天启圣女', '深渊之主', '永夜君王', '绯月巫女', '终焉之翼', '银河流光'],
    SR:  ['霜华剑士', '炎术士', '圣光祭司', '暗影刺客', '风语游侠', '岩盾守卫'],
    R:   ['史莱姆', '哥布林', '野狼', '石像鬼', '风精灵', '骷髅兵', '火焰蝙蝠', '小恶魔'],
    N:   ['木乃伊', '沼泽巨蛙', '普通村民', '生锈铁剑', '破旧布甲', '小石子', '枯树枝', '旧卷轴']
  };

  const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const $ = id => document.getElementById(id);

  /* ================= DOM ================= */
  const appEl = $('app');
  const rateEl = $('rate'), barEl = $('bar'), pityEl = $('pity'), hintEl = $('hint');
  const totalEl = $('total'), ssrEl = $('ssr'), spEl = $('sp'), spRateEl = $('spRate');
  const stageEl = $('stage'), gridEl = $('grid');
  const editorEl = $('editor'), edTabs = $('edTabs'), edList = $('edList');
  const edAddBtn = $('edAdd'), edClose = $('edClose'), edReset = $('edReset');
  const edStorage = $('edStorage');
  const galleryEl = $('gallery'), glList = $('glList'), glProgress = $('glProgress');
  const viewer = $('viewer'), viewerImg = $('viewerImg'), viewerClose = $('viewerClose');
  const btn1 = $('btn1'), btn10 = $('btn10');

  /* 演出层 DOM */
  const showcaseEl = $('showcase');
  const showcaseFrame = $('showcaseFrame');
  const showcaseCardWrap = $('showcaseCardWrap');
  const showcaseCard3d = $('showcaseCard3d');
  const showcaseImg = $('showcaseImg');
  const showcasePh = $('showcasePh');
  const showcaseRarity = $('showcaseRarity');
  const showcaseName = $('showcaseName');
  const showcaseHint = $('showcaseHint');
  const flashEl = $('showcaseFlash');
  const darkburstEl = $('showcaseDarkburst');

  /* ================= IndexedDB ================= */
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB 不可用')); return; }
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
        if (!db.objectStoreNames.contains('meta'))   db.createObjectStore('meta');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error || new Error('数据库打开失败'));
    });
    return dbPromise;
  }

  function idbGet(store, key) {
    return openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, 'readonly');
      const r = t.objectStore(store).get(key);
      r.onsuccess = () => res(r.result);
      r.onerror   = () => rej(r.error);
    }));
  }

  function idbPut(store, key, val) {
    return openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).put(val, key);
      t.oncomplete = () => res(true);
      t.onerror    = () => rej(t.error || new Error('写入失败'));
    }));
  }

  function idbDel(store, key) {
    return openDB().then(db => new Promise((res, rej) => {
      const t = db.transaction(store, 'readwrite');
      t.objectStore(store).delete(key);
      t.oncomplete = () => res(true);
      t.onerror    = () => rej(t.error);
    }));
  }

  /* ================= 图片 URL 缓存 ================= */
  const urlCache = new Map();

  function getImgURL(id, kind) {
    const key = id + ':' + kind;
    if (urlCache.has(key)) return Promise.resolve(urlCache.get(key));
    return idbGet('images', id).then(rec => {
      if (!rec) return '';
      const blob = kind === 'thumb' ? (rec.thumb || rec.blob) : (rec.blob || rec.thumb);
      if (!blob) return '';
      const url = URL.createObjectURL(blob);
      urlCache.set(key, url);
      return url;
    }).catch(() => '');
  }

  function clearURLCache(id) {
    ['full', 'thumb'].forEach(k => {
      const key = id + ':' + k;
      const u = urlCache.get(key);
      if (u) { URL.revokeObjectURL(u); urlCache.delete(key); }
    });
  }

  /* ================= 数据 ================= */
  let cards = null;
  let ready = false;
  let curRarity = 'SSR';

  /* 统计：cardId -> 抽到次数 */
  let stats = {};

  function loadStats() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      const obj = raw ? JSON.parse(raw) : {};
      stats = (obj && typeof obj === 'object') ? obj : {};
    } catch (e) { stats = {}; }
  }
  function saveStats() {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats)); } catch (e) {}
  }

  function defaultMeta() {
    const out = {};
    RARITIES.forEach(r => {
      out[r] = DEFAULT_CARDS[r].map(n => ({ id: uid(), name: n, hasImg: false, isGif: false }));
    });
    return out;
  }

  async function resizeImageToBlob(img, maxEdge, quality) {
    const w0 = img.naturalWidth || img.width;
    const h0 = img.naturalHeight || img.height;
    const scale = Math.min(1, maxEdge / Math.max(w0, h0));
    const w = Math.max(1, Math.round(w0 * scale));
    const h = Math.max(1, Math.round(h0 * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    return new Promise((res, rej) => {
      cv.toBlob(b => b ? res(b) : rej(new Error('图片编码失败')), 'image/jpeg', quality);
    });
  }

  async function tryMigrateOld() {
    try {
      const raw = localStorage.getItem(OLD_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      const meta = {};
      for (const r of RARITIES) {
        meta[r] = [];
        if (!Array.isArray(obj[r])) continue;
        for (const c of obj[r]) {
          const id = String(c.id || uid());
          let hasImg = false, isGif = false;
          if (c.img && /^data:image\//.test(c.img)) {
            try {
              const blob = await (await fetch(c.img)).blob();
              const isG = blob.type === 'image/gif';
              let thumb = null;
              if (isG) {
                const url = URL.createObjectURL(blob);
                const img = await new Promise((res, rej) => {
                  const i = new Image();
                  i.onload = () => res(i);
                  i.onerror = rej;
                  i.src = url;
                });
                thumb = await resizeImageToBlob(img, MAX_EDGE_THUMB, JPEG_Q_THUMB);
                URL.revokeObjectURL(url);
              }
              await idbPut('images', id, { blob, thumb, type: blob.type, isGif: isG });
              hasImg = true; isGif = isG;
            } catch (e) { /* 单张失败忽略 */ }
          }
          meta[r].push({ id, name: String(c.name || ''), hasImg, isGif });
        }
      }
      localStorage.removeItem(OLD_KEY);
      await idbPut('meta', META_KEY, meta);
      return meta;
    } catch (e) { return null; }
  }

  async function loadCards() {
    let meta = null;
    try { meta = await idbGet('meta', META_KEY); } catch (e) {}
    if (!meta) {
      meta = await tryMigrateOld();
      if (!meta) {
        meta = defaultMeta();
        try { await idbPut('meta', META_KEY, meta); } catch (e) {}
      }
    }
    const out = {};
    RARITIES.forEach(r => {
      out[r] = Array.isArray(meta[r]) ? meta[r].map(c => ({
        id: String(c.id || uid()),
        name: String(c.name || ''),
        hasImg: !!c.hasImg,
        isGif: !!c.isGif
      })) : [];
    });
    cards = out;
  }

  async function saveMeta() {
    try {
      await idbPut('meta', META_KEY, cards);
      return true;
    } catch (e) {
      toast(e && e.name === 'QuotaExceededError' ? '存储空间不足' : '保存失败');
      return false;
    }
  }

  function findCardById(id) {
    for (const r of RARITIES) {
      const arr = cards[r];
      if (!arr) continue;
      for (const c of arr) if (c.id === id) return c;
    }
    return null;
  }

  /* ================= 图片处理 ================= */
  function loadImageFromFile(file) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => res({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('图片解析失败')); };
      img.src = url;
    });
  }

  async function processImage(file) {
    if (!file || !/^image\//.test(file.type)) throw new Error('请选择图片文件');
    const isGif = file.type === 'image/gif';
    if (isGif && file.size > MAX_GIF) {
      throw new Error('GIF 超过 ' + (MAX_GIF / 1024 / 1024).toFixed(0) + 'MB，请先压缩再导入');
    }
    const { img, url } = await loadImageFromFile(file);
    try {
      const thumb = await resizeImageToBlob(img, MAX_EDGE_THUMB, JPEG_Q_THUMB);
      if (isGif) {
        return { blob: file, thumb, type: 'image/gif', isGif: true };
      }
      const full = await resizeImageToBlob(img, MAX_EDGE_FULL, JPEG_Q_FULL);
      return { blob: full, thumb, type: 'image/jpeg', isGif: false };
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  /* ================= 抽卡状态与概率 ================= */
  const state = { total: 0, pityCount: 0, ssrCount: 0, spCount: 0 };
  let drawing = false;

  function currentSSRRate() {
    const n = state.pityCount + 1;
    if (n <= 50) return 0.02;
    return Math.min(1, 0.02 + 0.02 * (n - 50));
  }

  function drawOne() {
    const ssrRate = currentSSRRate();
    const x = Math.random();
    let rarity;

    if (x < ssrRate) {
      rarity = Math.random() < 0.10 ? 'SP' : 'SSR';
    } else {
      const remain = 1 - ssrRate;
      if (remain <= 0) {
        rarity = 'N';
      } else {
        const y = (x - ssrRate) / remain;
        const srRatio = 8 / 98;
        const rRatio  = 25 / 98;
        if (y < srRatio)               rarity = 'SR';
        else if (y < srRatio + rRatio) rarity = 'R';
        else                           rarity = 'N';
      }
    }

    state.total++;
    if (rarity === 'SSR' || rarity === 'SP') {
      state.pityCount = 0;
      if (rarity === 'SSR') state.ssrCount++;
      else state.spCount++;
    } else {
      state.pityCount++;
    }

    const arr = cards[rarity] || [];
    const card = arr.length ? arr[Math.floor(Math.random() * arr.length)] : null;

    // 记录图鉴统计
    if (card && card.id) {
      stats[card.id] = (stats[card.id] || 0) + 1;
    }

    return {
      rarity,
      id: card ? card.id : '',
      name: card ? (card.name.trim() || '未命名') : '未命名',
      hasImg: card ? !!card.hasImg : false,
      isGif: card ? !!card.isGif : false,
      index: state.total
    };
  }

  /* ================= 渲染抽卡结果 ================= */
  const esc = s => String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function render(results) {
    stageEl.classList.add('show');
    gridEl.className = 'grid ' + (results.length > 1 ? 'g10' : 'g1');
    gridEl.innerHTML = '';

    results.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'card ' + r.rarity.toLowerCase()
        + (r.imgUrl ? ' has-img' : '')
        + (r.isGif ? ' gif-flag' : '');
      card.dataset.id = r.id || '';
      card.dataset.gif = r.isGif ? '1' : '0';
      card.dataset.hasimg = r.hasImg ? '1' : '0';
      card.style.animationDelay = (i * 60) + 'ms';
      card.innerHTML =
        (r.imgUrl ? '<img class="cimg" src="' + r.imgUrl + '" alt="">' : '') +
        '<span class="rarity">' + r.rarity + '</span>' +
        '<span class="cname">' + esc(r.name) + '</span>' +
        '<span class="idx">#' + r.index + '</span>';
      gridEl.appendChild(card);
    });

    if (results.some(r => r.rarity === 'SSR' || r.rarity === 'SP') && navigator.vibrate) {
      navigator.vibrate([18, 40, 18]);
    }
  }

  function updateStats() {
    const p = currentSSRRate();
    rateEl.textContent   = (p * 100).toFixed(2);
    spRateEl.textContent = (p * 10).toFixed(2);
    barEl.style.width    = Math.max(2, p * 100).toFixed(2) + '%';
    pityEl.textContent   = state.pityCount;
    totalEl.textContent  = state.total;
    ssrEl.textContent    = state.ssrCount;
    spEl.textContent     = state.spCount;

    const n = state.pityCount + 1;
    hintEl.textContent = n <= 50
      ? '前 50 抽概率恒定 · 还有 ' + (51 - n) + ' 抽开始提升'
      : '第 ' + n + ' 抽 · 概率提升中';
  }

  /* ================= 抽卡主流程 ================= */
  async function draw(times) {
    if (!ready) { toast('正在初始化…'); return; }
    if (drawing || showcasing) return;
    drawing = true;
    btn1.disabled = true;
    btn10.disabled = true;

    try {
      const results = [];
      for (let i = 0; i < times; i++) results.push(drawOne());
      saveStats();

      const useThumb = times > 1;
      await Promise.all(results.map(async r => {
        r.imgUrl = (r.hasImg && r.id) ? await getImgURL(r.id, useThumb ? 'thumb' : 'full') : '';
      }));

      render(results);
      updateStats();

      const specials = results.filter(r => r.rarity === 'SSR' || r.rarity === 'SP');
      if (specials.length) {
        queueShowcase(specials);
      } else {
        btn1.disabled = false;
        btn10.disabled = false;
      }
    } catch (e) {
      btn1.disabled = false;
      btn10.disabled = false;
    } finally {
      drawing = false;
    }
  }

  /* ================= 演出队列 ================= */
  let showQueue = [];
  let showReady = false;
  let showcasing = false;
  let showTimers = [];
  let showToken = 0;

  function clearShowTimers() {
    showTimers.forEach(t => clearTimeout(t));
    showTimers = [];
  }

  function queueShowcase(items) {
    showQueue = items.slice();
    showcasing = true;
    btn1.disabled = true;
    btn10.disabled = true;
    playNextShowcase();
  }

  function playNextShowcase() {
    clearShowTimers();
    if (!showQueue.length) { endShowcase(); return; }
    const item = showQueue.shift();
    presentShowcase(item);
  }

  function triggerFlash() {
    flashEl.classList.remove('burst');
    void flashEl.offsetWidth;
    flashEl.classList.add('burst');
  }

  async function presentShowcase(item) {
    showReady = false;
    const isSP = item.rarity === 'SP';
    const token = ++showToken;

    showcaseEl.classList.remove('open', 'ready');
    showcaseFrame.classList.remove('sp');
    showcaseCardWrap.classList.remove('sp');
    showcaseCard3d.classList.remove('flipped');
    flashEl.classList.remove('burst');
    darkburstEl.classList.remove('burst');

    showcaseRarity.textContent = item.rarity;
    showcaseRarity.className = 'showcase-rarity ' + (isSP ? 'sp' : 'ssr');
    showcaseName.textContent = item.name;
    showcaseName.className = 'showcase-name' + (isSP ? ' sp' : '');
    showcaseHint.textContent = showQueue.length
      ? '点击继续 · 剩余 ' + showQueue.length + ' 个'
      : '点击任意处继续';

    showcaseImg.removeAttribute('src');
    showcaseImg.style.display = 'none';
    showcasePh.textContent = item.name;
    showcasePh.style.display = '';

    void showcaseEl.offsetWidth;
    showcaseEl.classList.add('open');

    if (item.hasImg && item.id) {
      getImgURL(item.id, 'full').then(url => {
        if (token !== showToken || !url) return;
        showcaseImg.src = url;
        showcaseImg.style.display = '';
        showcasePh.style.display = 'none';
      }).catch(() => {});
    }

    showTimers.push(setTimeout(() => {
      if (token !== showToken) return;
      showcaseCard3d.classList.add('flipped');
    }, 620));

    if (isSP) {
      showTimers.push(setTimeout(() => {
        if (token !== showToken) return;
        darkburstEl.classList.remove('burst');
        void darkburstEl.offsetWidth;
        darkburstEl.classList.add('burst');
        showcaseFrame.classList.add('sp');
        showcaseCardWrap.classList.add('sp');
      }, 950));
    }

    showTimers.push(setTimeout(() => {
      if (token !== showToken) return;
      if (!isSP) triggerFlash();
    }, 1420));

    showTimers.push(setTimeout(() => {
      if (token !== showToken) return;
      showReady = true;
      showcaseEl.classList.add('ready');
    }, 1800));
  }

  function advanceShowcase() {
    if (!showReady) return;
    showReady = false;
    showcaseEl.classList.remove('ready');
    clearShowTimers();

    if (showQueue.length) {
      showcaseEl.classList.remove('open');
      showTimers.push(setTimeout(() => {
        playNextShowcase();
      }, 300));
    } else {
      endShowcase();
    }
  }

  function endShowcase() {
    clearShowTimers();
    showToken++;
    showcaseEl.classList.remove('open', 'ready');
    showcasing = false;
    showReady = false;
    btn1.disabled = false;
    btn10.disabled = false;
    setTimeout(() => {
      showcaseFrame.classList.remove('sp');
      showcaseCardWrap.classList.remove('sp');
      showcaseCard3d.classList.remove('flipped');
      showcaseImg.removeAttribute('src');
      showcaseImg.style.display = 'none';
      showcasePh.style.display = '';
    }, 400);
  }

  showcaseEl.addEventListener('click', advanceShowcase);

  /* ================= 查看大图 ================= */
  function openViewer(url) {
    if (!url) return;
    viewerImg.src = url;
    viewer.classList.add('open');
  }
  function closeViewer() {
    viewer.classList.remove('open');
    viewerImg.removeAttribute('src');
  }
  viewerClose.addEventListener('click', closeViewer);
  viewer.addEventListener('click', e => {
    if (e.target === viewer) closeViewer();
  });

  gridEl.addEventListener('click', async e => {
    const card = e.target.closest('.card');
    if (!card) return;
    if (card.dataset.hasimg !== '1') return;
    const id = card.dataset.id;
    if (!id) return;
    const url = await getImgURL(id, 'full');
    if (!url) return;
    openViewer(url);
  });

  /* ================= 图鉴 ================= */
  let glToken = 0;

  async function renderGallery() {
    const token = ++glToken;
    if (!cards) return;

    let totalAll = 0, totalOwned = 0;
    const secs = [];
    for (const r of RARITIES) {
      const arr = cards[r] || [];
      totalAll += arr.length;
      let owned = 0;
      for (const c of arr) if ((stats[c.id] || 0) > 0) owned++;
      totalOwned += owned;
      secs.push({ r, arr, owned });
    }
    glProgress.textContent = totalOwned + ' / ' + totalAll;

    if (!totalAll) {
      glList.innerHTML = '<div class="gl-empty">卡池为空</div>';
      return;
    }

    let html = '';
    for (const sec of secs) {
      if (!sec.arr.length) continue;
      html += '<div class="gl-section">';
      html += '<div class="gl-sec-title">';
      html += '<span class="gl-sec-r ' + sec.r.toLowerCase() + '">' + sec.r + '</span>';
      html += '<span class="gl-sec-n">' + sec.owned + '/' + sec.arr.length + '</span>';
      html += '</div>';
      html += '<div class="gl-grid">';
      for (const c of sec.arr) {
        const count = stats[c.id] || 0;
        const owned = count > 0;
        html += '<div class="gl-item ' + (owned ? 'owned' : 'locked') + '" data-id="' + c.id + '">';
        html += '<div class="gl-thumb">';
        html += '<span class="gl-ph">' + esc(c.name || '未命名') + '</span>';
        if (owned) html += '<span class="gl-count">×' + count + '</span>';
        html += '</div>';
        html += '<div class="gl-name">' + esc(c.name || '未命名') + '</div>';
        html += '</div>';
      }
      html += '</div></div>';
    }
    glList.innerHTML = html;

    const items = Array.from(glList.querySelectorAll('.gl-item'));
    const tasks = items.map(async el => {
      const id = el.dataset.id;
      const card = findCardById(id);
      if (!card || !card.hasImg) return null;
      const url = await getImgURL(id, 'thumb');
      if (!url) return null;
      return { el, url };
    });
    const results = await Promise.all(tasks);
    if (token !== glToken) return;
    results.forEach(res => {
      if (!res) return;
      const thumb = res.el.querySelector('.gl-thumb');
      if (!thumb || thumb.querySelector('img')) return;
      const img = document.createElement('img');
      img.src = res.url;
      img.alt = '';
      img.loading = 'lazy';
      thumb.insertBefore(img, thumb.firstChild);
      const ph = thumb.querySelector('.gl-ph');
      if (ph) ph.remove();
    });
  }

  function openGallery() {
    if (!ready) { toast('正在初始化…'); return; }
    renderGallery();
    galleryEl.classList.add('open');
  }
  function closeGallery() {
    galleryEl.classList.remove('open');
    glToken++;
  }

  $('btnGallery').addEventListener('click', openGallery);
  $('glClose').addEventListener('click', closeGallery);

  glList.addEventListener('click', async e => {
    const item = e.target.closest('.gl-item');
    if (!item) return;
    if (!item.classList.contains('owned')) return;
    const id = item.dataset.id;
    const url = await getImgURL(id, 'full');
    if (url) openViewer(url);
  });

  /* ================= 编辑器 ================= */
  let editorToken = 0;

  function renderEditorTabs() {
    edTabs.innerHTML = RARITIES.map(r =>
      '<button class="ed-tab' + (r === curRarity ? ' on' : '') + '" data-r="' + r + '">' +
        '<span class="tab-r">' + r + '</span>' +
        '<span class="tab-n">' + (cards[r] ? cards[r].length : 0) + '</span>' +
      '</button>'
    ).join('');
  }

  async function renderEditor() {
    const token = ++editorToken;
    renderEditorTabs();

    const arr = cards[curRarity] || [];
    if (!arr.length) {
      edList.innerHTML = '<div class="ed-empty">暂无卡面<br><span>点击右上角「+ 添加」创建</span></div>';
      updateStorageInfo();
      return;
    }

    const each = (100 / arr.length).toFixed(1);
    edList.innerHTML = arr.map(c => {
      return '<div class="ed-item" data-id="' + c.id + '">' +
        '<label class="ed-thumb">' +
          '<span class="ph">+ 图片</span>' +
          (c.isGif ? '<span class="gif-tag">GIF</span>' : '') +
          '<input type="file" accept="image/*" class="ed-file" hidden>' +
        '</label>' +
        '<div class="ed-body">' +
          '<input class="ed-name" type="text" value="' + esc(c.name) + '" ' +
                 'placeholder="输入卡面名称" maxlength="14">' +
          '<div class="ed-sub">' + curRarity + ' · 共 ' + arr.length +
            ' 张 · 该稀有度内占比 ' + each + '%</div>' +
        '</div>' +
        '<button class="ed-del" data-act="del" aria-label="删除">✕</button>' +
      '</div>';
    }).join('');

    const urls = await Promise.all(arr.map(c => c.hasImg ? getImgURL(c.id, 'thumb') : Promise.resolve('')));
    if (token !== editorToken) return;
    arr.forEach((c, i) => {
      if (!urls[i]) return;
      const item = edList.querySelector('.ed-item[data-id="' + c.id + '"] .ed-thumb');
      if (!item || item.querySelector('img')) return;
      const img = document.createElement('img');
      img.src = urls[i];
      img.alt = '';
      item.insertBefore(img, item.firstChild);
      const ph = item.querySelector('.ph');
      if (ph) ph.remove();
    });

    updateStorageInfo();
  }

  async function updateStorageInfo() {
    if (!navigator.storage || !navigator.storage.estimate) { edStorage.textContent = ''; return; }
    try {
      const { usage, quota } = await navigator.storage.estimate();
      const fmt = n => {
        if (!n) return '0';
        if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        return (n / 1024 / 1024).toFixed(1) + ' MB';
      };
      edStorage.textContent = '已用 ' + fmt(usage) + ' / 约 ' + fmt(quota);
    } catch (e) { edStorage.textContent = ''; }
  }

  edTabs.addEventListener('click', e => {
    const tab = e.target.closest('.ed-tab');
    if (!tab) return;
    curRarity = tab.dataset.r;
    renderEditor();
    edList.scrollTop = 0;
  });

  edList.addEventListener('click', async e => {
    const del = e.target.closest('[data-act="del"]');
    if (!del) return;
    const item = del.closest('.ed-item');
    if (!item) return;
    const id = item.dataset.id;
    const arr = cards[curRarity];
    const idx = arr.findIndex(c => c.id === id);
    if (idx < 0) return;

    const [removed] = arr.splice(idx, 1);
    if (!await saveMeta()) { arr.splice(idx, 0, removed); return; }
    clearURLCache(id);
    await idbDel('images', id).catch(() => {});
    if (stats[id]) { delete stats[id]; saveStats(); }
    renderEditor();
  });

  let nameTimer = null;
  edList.addEventListener('input', e => {
    const input = e.target;
    if (!input.classList.contains('ed-name')) return;
    const item = input.closest('.ed-item');
    if (!item) return;
    const card = cards[curRarity].find(c => c.id === item.dataset.id);
    if (!card) return;
    card.name = input.value;
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => saveMeta(), 500);
  });

  edList.addEventListener('focusin', e => {
    if (e.target.classList.contains('ed-name')) {
      const el = e.target;
      setTimeout(() => {
        try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
      }, 300);
    }
  });

  edList.addEventListener('change', async e => {
    const input = e.target;
    if (!input.classList.contains('ed-file')) return;
    const file = input.files && input.files[0];
    if (!file) return;
    const item = input.closest('.ed-item');
    if (!item) return;
    const id = item.dataset.id;
    const targetRarity = curRarity;
    input.value = '';

    const card = cards[targetRarity].find(c => c.id === id);
    if (!card) return;

    toast('处理中…');
    try {
      const rec = await processImage(file);
      await idbPut('images', id, rec);

      const oldHas = card.hasImg, oldGif = card.isGif;
      card.hasImg = true;
      card.isGif = !!rec.isGif;
      if (!await saveMeta()) {
        card.hasImg = oldHas;
        card.isGif = oldGif;
        await idbDel('images', id).catch(() => {});
        throw new Error('保存失败');
      }
      clearURLCache(id);
      if (curRarity === targetRarity) renderEditor();
      toast(rec.isGif ? 'GIF 已更新' : '图片已更新');
    } catch (err) {
      toast(err.message || '图片处理失败');
    }
  });

  edAddBtn.addEventListener('click', async () => {
    const nc = { id: uid(), name: '', hasImg: false, isGif: false };
    cards[curRarity].push(nc);
    if (!await saveMeta()) { cards[curRarity].pop(); return; }
    await renderEditor();

    const items = edList.querySelectorAll('.ed-item');
    const last = items[items.length - 1];
    if (last) {
      try { last.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (err) {}
      setTimeout(() => {
        const nameInput = last.querySelector('.ed-name');
        if (nameInput) nameInput.focus();
      }, 380);
    }
  });

  edReset.addEventListener('click', async () => {
    if (!confirm('恢复为默认卡池？所有自定义内容（含图片）和抽卡统计将被清除。')) return;
    const oldCards = cards;
    const meta = defaultMeta();
    cards = meta;
    if (!await saveMeta()) { cards = oldCards; return; }

    for (const r of RARITIES) {
      for (const c of oldCards[r]) {
        if (c.hasImg) {
          clearURLCache(c.id);
          await idbDel('images', c.id).catch(() => {});
        }
      }
    }
    stats = {};
    saveStats();
    await renderEditor();
    toast('已恢复默认卡池');
  });

  function openEditor() {
    if (!ready) { toast('正在初始化…'); return; }
    renderEditor();
    editorEl.classList.add('open');
  }

  function closeEditor() {
    editorEl.classList.remove('open');
    stageEl.classList.remove('show');
    gridEl.innerHTML = '';
  }

  $('btnEdit').addEventListener('click', openEditor);
  edClose.addEventListener('click', closeEditor);

  /* ================= Toast ================= */
  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      appEl.appendChild(el);
    }
    el.textContent = msg;
    requestAnimationFrame(() => el.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
  }{

  /* ================= 启动 ================= */
  btn1.addEventListener('click', () => draw(1));
  btn10.addEventListener('click', () => draw(10));

  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  async function init() {
    try {
      await openDB();
    } catch (e) {
      toast('浏览器不支持本地数据库，请更换浏览器');
      return;
    }
    try { await loadCards(); } catch (e) { cards = defaultMeta(); }
    loadStats();
    updateStats();
    ready = true;

    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
  }

  init();
})();
</script>
</body>
</html>
